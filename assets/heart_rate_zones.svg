<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Heart Rate Training Zones</title>
  <desc id="desc">Dark themed five-zone heart rate and music tempo reference chart.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#07110b"/>
      <stop offset="0.55" stop-color="#101318"/>
      <stop offset="1" stop-color="#17110d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="420" rx="18" fill="url(#bg)"/>
  <text x="54" y="62" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800">Heart Rate Zones</text>
  <text x="54" y="94" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="17">Use this as a visual reference for the playlist zones below.</text>
  <g transform="translate(54 130)" filter="url(#shadow)">
    <rect x="0" y="0" width="210" height="230" rx="12" fill="#1f2937" stroke="#ffffff" stroke-opacity="0.14"/>
    <rect x="0" y="0" width="210" height="16" rx="8" fill="#9ca3af"/>
    <text x="22" y="50" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800">Zone 1</text>
    <text x="22" y="82" fill="#e5e7eb" font-family="Arial, Helvetica, sans-serif" font-size="18">Recovery</text>
    <text x="22" y="132" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="800">60-110</text>
    <text x="22" y="160" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="17">Heart BPM</text>
    <text x="22" y="205" fill="#d8f8e3" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Music 60-95 BPM</text>
  </g>
  <g transform="translate(276 130)" filter="url(#shadow)">
    <rect x="0" y="0" width="210" height="230" rx="12" fill="#052e16" stroke="#ffffff" stroke-opacity="0.14"/>
    <rect x="0" y="0" width="210" height="16" rx="8" fill="#2ecc71"/>
    <text x="22" y="50" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800">Zone 2</text>
    <text x="22" y="82" fill="#dcfce7" font-family="Arial, Helvetica, sans-serif" font-size="18">Endurance</text>
    <text x="22" y="132" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="800">110-130</text>
    <text x="22" y="160" fill="#bbf7d0" font-family="Arial, Helvetica, sans-serif" font-size="17">Heart BPM</text>
    <text x="22" y="205" fill="#d8f8e3" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Music 90-120 BPM</text>
  </g>
  <g transform="translate(498 130)" filter="url(#shadow)">
    <rect x="0" y="0" width="210" height="230" rx="12" fill="#422006" stroke="#ffffff" stroke-opacity="0.14"/>
    <rect x="0" y="0" width="210" height="16" rx="8" fill="#f1c40f"/>
    <text x="22" y="50" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800">Zone 3</text>
    <text x="22" y="82" fill="#fef3c7" font-family="Arial, Helvetica, sans-serif" font-size="18">Tempo</text>
    <text x="22" y="132" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="800">130-150</text>
    <text x="22" y="160" fill="#fde68a" font-family="Arial, Helvetica, sans-serif" font-size="17">Heart BPM</text>
    <text x="22" y="205" fill="#d8f8e3" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Music 115-135 BPM</text>
  </g>
  <g transform="translate(720 130)" filter="url(#shadow)">
    <rect x="0" y="0" width="210" height="230" rx="12" fill="#431407" stroke="#ffffff" stroke-opacity="0.14"/>
    <rect x="0" y="0" width="210" height="16" rx="8" fill="#e67e22"/>
    <text x="22" y="50" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800">Zone 4</text>
    <text x="22" y="82" fill="#fed7aa" font-family="Arial, Helvetica, sans-serif" font-size="18">Threshold</text>
    <text x="22" y="132" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="800">150-170</text>
    <text x="22" y="160" fill="#fdba74" font-family="Arial, Helvetica, sans-serif" font-size="17">Heart BPM</text>
    <text x="22" y="205" fill="#d8f8e3" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Music 125-150 BPM</text>
  </g>
  <g transform="translate(942 130)" filter="url(#shadow)">
    <rect x="0" y="0" width="210" height="230" rx="12" fill="#450a0a" stroke="#ffffff" stroke-opacity="0.14"/>
    <rect x="0" y="0" width="210" height="16" rx="8" fill="#e74c3c"/>
    <text x="22" y="50" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800">Zone 5</text>
    <text x="22" y="82" fill="#fecaca" font-family="Arial, Helvetica, sans-serif" font-size="18">Maximum</text>
    <text x="22" y="132" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="800">170-220</text>
    <text x="22" y="160" fill="#fca5a5" font-family="Arial, Helvetica, sans-serif" font-size="17">Heart BPM</text>
    <text x="22" y="205" fill="#d8f8e3" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Music 140-170 BPM</text>
  </g>
</svg>
